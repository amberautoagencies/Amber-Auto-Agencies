<!DOCTYPE html>
<html lang="en">

<head>
<script>
if (sessionStorage.getItem("amberAdminLoggedIn") !== "true") {
    window.location.href = "index.html";
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amber Auto Agencies - Products</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #101828;
}

.header {
    background: #101828;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.back {
    background: #f59e0b;
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

.page-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.page-title h2 {
    margin: 0;
}

.add-btn {
    background: #f59e0b;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.add-btn:hover {
    background: #d97706;
}

.form-box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    margin-bottom: 30px;
    display: none;
}

.form-box h3 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    margin-bottom: 7px;
    font-weight: bold;
}

input,
textarea,
select {
    padding: 11px;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    font-size: 15px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
    outline: none;
    border-color: #f59e0b;
}

.save-btn {
    margin-top: 20px;
    background: #f59e0b;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.save-btn:hover {
    background: #d97706;
}

.cancel-btn {
    margin-top: 20px;
    margin-left: 10px;
    background: #667085;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
}

.products-box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.product-card {
    border-bottom: 1px solid #e4e7ec;
    padding: 18px 0;
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.product-card:last-child {
    border-bottom: none;
}

.product-info h3 {
    margin: 0 0 7px;
}

.product-info p {
    margin: 4px 0;
    color: #667085;
}

.product-actions {
    display: flex;
    align-items: flex-start;
    gap: 8px;
}

.product-actions button {
    border: none;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.edit-btn {
    background: #e4e7ec;
    color: #101828;
}

.edit-btn:hover {
    background: #d0d5dd;
}

.delete-btn {
    background: #fee4e2;
    color: #b42318;
}

.delete-btn:hover {
    background: #fecdca;
}

.empty {
    text-align: center;
    padding: 40px 10px;
    color: #667085;
}

@media (max-width: 700px) {

    .header h1 {
        font-size: 17px;
    }

    .container {
        padding: 20px 15px;
    }

    .page-title {
        align-items: flex-start;
        gap: 15px;
        flex-direction: column;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .product-card {
        flex-direction: column;
    }

    .product-actions {
        align-items: flex-start;
    }

}

</style>
</head>

<body>

<div class="header">

    <h1>Amber Auto Agencies — Products</h1>

    <button class="back" onclick="goDashboard()">
        ← Dashboard
    </button>

</div>


<div class="container">

    <div class="page-title">

        <h2>Product Management</h2>

        <button class="add-btn" onclick="showForm()">
            + Add Product
        </button>

    </div>


    <div class="form-box" id="formBox">

        <input type="hidden" id="editProductId">

        <h3 id="formTitle">Add New Product</h3>

        <div class="form-grid">

            <div class="form-group">

                <label>Product Name</label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Example: MDS H4 Halogen Bulb">

            </div>


            <div class="form-group">

                <label>Part Number</label>

                <input
                    type="text"
                    id="partNumber"
                    placeholder="Example: HN2711">

            </div>


            <div class="form-group">

                <label>Price (₹)</label>

                <input
                    type="number"
                    id="price"
                    placeholder="Example: 620">

            </div>


            <div class="form-group">

                <label>MRP (₹)</label>

                <input
                    type="number"
                    id="mrp"
                    placeholder="Example: 700">

            </div>


            <div class="form-group">

                <label>Stock Quantity</label>

                <input
                    type="number"
                    id="stock"
                    placeholder="Example: 50">

            </div>


            <div class="form-group">

                <label>Brand</label>

                <input
                    type="text"
                    id="brand"
                    placeholder="Example: MDS">

            </div>


            <div class="form-group">

                <label>Voltage</label>

                <input
                    type="text"
                    id="voltage"
                    placeholder="Example: 12V">

            </div>


            <div class="form-group">

                <label>Type</label>

                <input
                    type="text"
                    id="type"
                    placeholder="Example: Halogen Bulb">

            </div>


            <div class="form-group">

                <label>Category</label>

                <select id="category">

                    <option value="">Select Category</option>

                    <option value="Auto Electrical">
                        Auto Electrical
                    </option>

                    <option value="Suspension Parts">
                        Suspension Parts
                    </option>

                    <option value="Batteries">
                        Batteries
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group full">

                <label>Vehicle Compatibility</label>

                <input
                    type="text"
                    id="compatibility"
                    placeholder="Example: Maruti Omni / Van">

            </div>


            <div class="form-group full">

                <label>Product Description</label>

                <textarea
                    id="description"
                    placeholder="Enter product description"></textarea>

            </div>


            <div class="form-group full">

                <label>Product Image</label>

                <input
                    type="file"
                    id="productImage"
                    accept="image/*">

            </div>

        </div>


        <button class="save-btn" onclick="saveProduct()">
            Save Product
        </button>


        <button class="cancel-btn" onclick="hideForm()">
            Cancel
        </button>

    </div>


    <div class="products-box">

        <h3>Your Products</h3>

        <div id="productList"></div>

    </div>

</div>


<script>

function showForm() {

    document.getElementById("formBox").style.display = "block";

    document.getElementById("formTitle").innerText =
        "Add New Product";

}


function hideForm() {

    document.getElementById("formBox").style.display = "none";

    clearForm();

}


function clearForm() {

    document.getElementById("editProductId").value = "";

    document.getElementById("productName").value = "";

    document.getElementById("partNumber").value = "";

    document.getElementById("price").value = "";

    document.getElementById("mrp").value = "";

    document.getElementById("stock").value = "";

    document.getElementById("brand").value = "";

    document.getElementById("voltage").value = "";

    document.getElementById("type").value = "";

    document.getElementById("category").value = "";

    document.getElementById("compatibility").value = "";

    document.getElementById("description").value = "";

    document.getElementById("productImage").value = "";

    document.getElementById("formTitle").innerText =
        "Add New Product";

}


function saveProduct() {

    var name =
        document.getElementById("productName").value.trim();

    var part =
        document.getElementById("partNumber").value.trim();

    var price =
        document.getElementById("price").value;

    var mrp =
        document.getElementById("mrp").value;

    var stock =
        document.getElementById("stock").value;

    var brand =
        document.getElementById("brand").value.trim();

    var voltage =
        document.getElementById("voltage").value.trim();

    var type =
        document.getElementById("type").value.trim();

    var category =
        document.getElementById("category").value;

    var compatibility =
        document.getElementById("compatibility").value.trim();

    var description =
        document.getElementById("description").value.trim();

    var editId =
        document.getElementById("editProductId").value;

    var imageInput =
        document.getElementById("productImage");

    var imageFile =
        imageInput.files[0];


    if (!name || !part || !price) {

        alert(
            "Please enter Product Name, Part Number and Price."
        );

        return;

    }


    var products =
        JSON.parse(
            localStorage.getItem("amberProducts")
        ) || [];


    function saveProductData(imageData) {

        if (editId) {

            products = products.map(function(product) {

                if (String(product.id) === String(editId)) {

                    return {

                        id: product.id,

                        name: name,

                        partNumber: part,

                        price: price,

                        mrp: mrp,

                        stock: stock,

                        brand: brand,

                        voltage: voltage,

                        type: type,

                        category: category,

                        compatibility: compatibility,

                        description: description,

                        image:
                            imageData ||
                            product.image ||
                            ""

                    };

                }

                return product;

            });

            alert("Product updated successfully!");

        } else {

            var product = {

                id: Date.now(),

                name: name,

                partNumber: part,

                price: price,

                mrp: mrp,

                stock: stock,

                brand: brand,

                voltage: voltage,

                type: type,

                category: category,

                compatibility: compatibility,

                description: description,

                image: imageData || ""

            };


            products.push(product);

            alert("Product saved successfully!");

        }


        localStorage.setItem(
            "amberProducts",
            JSON.stringify(products)
        );


        clearForm();

        hideForm();

        loadProducts();

    }


    if (imageFile) {

        var reader =
            new FileReader();


        reader.onload = function(e) {

            saveProductData(e.target.result);

        };


        reader.readAsDataURL(imageFile);

    } else {

        saveProductData("");

    }

}


function loadProducts() {

    var products =
        JSON.parse(
            localStorage.getItem("amberProducts")
        ) || [];


    var productList =
        document.getElementById("productList");


    if (products.length === 0) {

        productList.innerHTML = `

            <div class="empty">

                No products added yet.

                <br><br>

                Click <b>+ Add Product</b>
                to add your first product.

            </div>

        `;

        return;

    }


    productList.innerHTML = "";


    products.forEach(function(product) {

        var productCard =
            document.createElement("div");

        productCard.className =
            "product-card";


        productCard.innerHTML = `

            <div>

                ${
                    product.image
                    ? `
                    <div style="margin-bottom:15px;">
                        <img
                            src="${product.image}"
                            alt="${product.name}"
                            style="width:120px;height:120px;object-fit:contain;border:1px solid #e4e7ec;border-radius:8px;padding:5px;">
                    </div>
                    `
                    : ""
                }

            </div>


            <div class="product-info">

                <h3>${product.name}</h3>

                <p>
                    <b>Part Number:</b>
                    ${product.partNumber || "Not specified"}
                </p>

                <p>
                    <b>Brand:</b>
                    ${product.brand || "Not specified"}
                </p>

                <p>
                    <b>Voltage:</b>
                    ${product.voltage || "Not specified"}
                </p>

                <p>
                    <b>Type:</b>
                    ${product.type || "Not specified"}
                </p>

                <p>
                    <b>Category:</b>
                    ${product.category || "Not specified"}
                </p>

                <p>
                    <b>Vehicle:</b>
                    ${product.compatibility || "Not specified"}
                </p>

                <p>
                    <b>Price:</b>
                    ₹${product.price}
                </p>

                <p>
                    <b>MRP:</b>
                    ₹${product.mrp || "Not specified"}
                </p>

                <p>
                    <b>Stock:</b>
                    ${product.stock || 0}
                </p>

                <p>
                    ${product.description || ""}
                </p>

            </div>


            <div class="product-actions">

                <button
                    class="edit-btn"
                    onclick="editProduct(${product.id})">

                    Edit

                </button>


                <button
                    class="delete-btn"
                    onclick="deleteProduct(${product.id})">

                    Delete

                </button>

            </div>

        `;


        productList.appendChild(productCard);

    });

}


function editProduct(id) {

    var products =
        JSON.parse(
            localStorage.getItem("amberProducts")
        ) || [];


    var product =
        products.find(function(p) {

            return String(p.id) === String(id);

        });


    if (!product) {

        alert("Product not found.");

        return;

    }


    document.getElementById("editProductId").value =
        product.id;

    document.getElementById("productName").value =
        product.name || "";

    document.getElementById("partNumber").value =
        product.partNumber || "";

    document.getElementById("price").value =
        product.price || "";

    document.getElementById("mrp").value =
        product.mrp || "";

    document.getElementById("stock").value =
        product.stock || "";

    document.getElementById("brand").value =
        product.brand || "";

    document.getElementById("voltage").value =
        product.voltage || "";

    document.getElementById("type").value =
        product.type || "";

    document.getElementById("category").value =
        product.category || "";

    document.getElementById("compatibility").value =
        product.compatibility || "";

    document.getElementById("description").value =
        product.description || "";

    document.getElementById("formTitle").innerText =
        "Edit Product";

    document.getElementById("formBox").style.display =
        "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function deleteProduct(id) {

    if (
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ) {

        return;

    }


    var products =
        JSON.parse(
            localStorage.getItem("amberProducts")
        ) || [];


    products =
        products.filter(function(product) {

            return String(product.id) !== String(id);

        });


    localStorage.setItem(
        "amberProducts",
        JSON.stringify(products)
    );


    loadProducts();

}


function goDashboard() {

    window.location.href =
        "dashboard.html";

}


loadProducts();

</script>

</body>
</html>
