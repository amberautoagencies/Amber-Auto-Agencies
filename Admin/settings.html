<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Business Settings - Amber Auto Agencies</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #101828;
}

/* HEADER */

.header {
    background: #101828;
    color: white;
    padding: 18px 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.back-btn {
    background: #f59e0b;
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.back-btn:hover {
    background: #d97706;
}

/* MAIN */

.container {
    max-width: 800px;
    margin: auto;
    padding: 30px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
}

.description {
    color: #667085;
    margin-bottom: 25px;
}

/* FORM */

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #f59e0b;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

/* SAVE BUTTON */

.save-btn {
    background: #f59e0b;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

.save-btn:hover {
    background: #d97706;
}

.message {
    margin-top: 15px;
    font-weight: bold;
    color: #16a34a;
}


.password-card {
    margin-top: 24px;
    border-top: 1px solid #e4e7ec;
    padding-top: 24px;
}

.password-card h2 {
    margin-bottom: 8px;
}

.password-note {
    color: #667085;
    font-size: 14px;
    margin-bottom: 20px;
}

.password-btn {
    background: #101828;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

.password-btn:hover {
    background: #344054;
}

.password-btn:disabled,
.save-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* MOBILE */

@media (max-width: 600px) {

    .header {
        padding: 15px;
    }

    .header h1 {
        font-size: 17px;
    }

    .container {
        padding: 20px 15px;
    }

    .card {
        padding: 20px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>
        Business Settings
    </h1>

    <button
        class="back-btn"
        onclick="window.location.href='dashboard.html'">

        ← Dashboard

    </button>

</div>


<!-- MAIN -->

<div class="container">

    <div class="card">

        <h2>
            Business Information
        </h2>

        <p class="description">
            Update the information used by
            Amber Auto Agencies.
        </p>


        <!-- BUSINESS NAME -->

        <div class="form-group">

            <label>
                Business Name
            </label>

            <input
                type="text"
                id="businessName"
                placeholder="Amber Auto Agencies">

        </div>


        <!-- PHONE -->

        <div class="form-group">

            <label>
                Phone Number
            </label>

            <input
                type="text"
                id="phone"
                placeholder="Example: 917758861213">

        </div>


        <!-- WHATSAPP -->

        <div class="form-group">

            <label>
                WhatsApp Number
            </label>

            <input
                type="text"
                id="whatsapp"
                placeholder="Example: 917758861213">

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Example: info@example.com">

        </div>


        <!-- ADDRESS -->

        <div class="form-group">

            <label>
                Business Address
            </label>

            <textarea
                id="address"
                placeholder="Enter your complete business address"></textarea>

        </div>


        <!-- UPI -->

        <div class="form-group">

            <label>
                UPI ID
            </label>

            <input
                type="text"
                id="upi"
                placeholder="Example: yourname@upi">

        </div>


        <button
            class="save-btn"
            onclick="saveSettings()">

            Save Settings

        </button>


        <div
            id="message"
            class="message">
        </div>


        <div class="password-card">
            <h2>Change Admin Password</h2>
            <p class="password-note">
                Enter your current password first, then choose a new password.
                Your password is handled by Supabase Authentication and is not stored in this page.
            </p>

            <div class="form-group">
                <label>Current Password</label>
                <input
                    type="password"
                    id="currentPassword"
                    autocomplete="current-password"
                    placeholder="Enter current admin password">
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    autocomplete="new-password"
                    placeholder="Enter new password">
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <input
                    type="password"
                    id="confirmNewPassword"
                    autocomplete="new-password"
                    placeholder="Re-enter new password">
            </div>

            <button
                class="password-btn"
                id="changePasswordBtn"
                onclick="changeAdminPassword()">
                Change Password
            </button>

            <div id="passwordMessage" class="message"></div>
        </div>


    </div>

</div>


<script>
const SUPABASE_URL =
    "https://vkgvexnaoqgonnmtdlkl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_uAdyfJX0gFlQtpbPutxjHw_acg8RzOF";

const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let settingsRowId = null;

async function requireAdminSession() {

    const {
        data: { session },
        error
    } = await supabaseClient.auth.getSession();

    if (error || !session) {
        window.location.href = "index.html";
        return false;
    }

    return true;
}

function showMessage(text, isError = false) {

    const box = document.getElementById("message");
    box.innerText = text;
    box.style.color = isError ? "#d92d20" : "#16a34a";

    setTimeout(function() {
        box.innerText = "";
    }, 4000);
}

async function loadSettings() {

    if (!(await requireAdminSession())) return;

    const { data, error } = await supabaseClient
        .from("Business_Settings")
        .select("*")
        .order("created_at", { ascending: true })
        .limit(1)
        .maybeSingle();

    if (error) {
        console.error("Settings loading error:", error);
        showMessage("Could not load settings: " + error.message, true);
        return;
    }

    if (!data) return;

    settingsRowId = data.id;

    document.getElementById("businessName").value =
        data.business_name || "";

    document.getElementById("phone").value =
        data.phone || "";

    document.getElementById("whatsapp").value =
        data.whatsapp || "";

    document.getElementById("email").value =
        data.email || "";

    document.getElementById("address").value =
        data.address || "";

    document.getElementById("upi").value =
        data.upi || "";
}

async function saveSettings() {

    if (!(await requireAdminSession())) return;

    const saveButton = document.querySelector(".save-btn");
    saveButton.disabled = true;
    saveButton.innerText = "Saving...";

    const settings = {
        business_name:
            document.getElementById("businessName").value.trim(),

        phone:
            document.getElementById("phone").value.trim(),

        whatsapp:
            document.getElementById("whatsapp").value.trim(),

        email:
            document.getElementById("email").value.trim(),

        address:
            document.getElementById("address").value.trim(),

        upi:
            document.getElementById("upi").value.trim()
    };

    let result;

    if (settingsRowId !== null) {

        result = await supabaseClient
            .from("Business_Settings")
            .update(settings)
            .eq("id", settingsRowId)
            .select()
            .single();

    } else {

        result = await supabaseClient
            .from("Business_Settings")
            .insert(settings)
            .select()
            .single();
    }

    saveButton.disabled = false;
    saveButton.innerText = "Save Settings";

    if (result.error) {
        console.error("Settings save error:", result.error);
        showMessage("Could not save settings: " + result.error.message, true);
        return;
    }

    settingsRowId = result.data.id;
    showMessage("✓ Settings saved successfully.");
}


function showPasswordMessage(text, isError = false) {
    const box = document.getElementById("passwordMessage");
    box.innerText = text;
    box.style.color = isError ? "#d92d20" : "#16a34a";

    setTimeout(function() {
        box.innerText = "";
    }, 6000);
}

async function changeAdminPassword() {
    if (!(await requireAdminSession())) return;

    const currentPassword =
        document.getElementById("currentPassword").value;

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmNewPassword =
        document.getElementById("confirmNewPassword").value;

    if (!currentPassword || !newPassword || !confirmNewPassword) {
        showPasswordMessage("Please fill in all password fields.", true);
        return;
    }

    if (newPassword.length < 8) {
        showPasswordMessage("New password must be at least 8 characters.", true);
        return;
    }

    if (newPassword !== confirmNewPassword) {
        showPasswordMessage("New password and confirmation do not match.", true);
        return;
    }

    if (currentPassword === newPassword) {
        showPasswordMessage("New password must be different from the current password.", true);
        return;
    }

    const button = document.getElementById("changePasswordBtn");
    button.disabled = true;
    button.innerText = "Changing Password...";

    try {
        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();

        if (userError || !user || !user.email) {
            showPasswordMessage("Could not identify the signed-in admin account.", true);
            return;
        }

        // Re-authenticate with the current password before allowing the change.
        const { error: signInError } =
            await supabaseClient.auth.signInWithPassword({
                email: user.email,
                password: currentPassword
            });

        if (signInError) {
            showPasswordMessage("Current password is incorrect.", true);
            return;
        }

        const { error: updateError } =
            await supabaseClient.auth.updateUser({
                password: newPassword
            });

        if (updateError) {
            showPasswordMessage(
                "Could not change password: " + updateError.message,
                true
            );
            return;
        }

        document.getElementById("currentPassword").value = "";
        document.getElementById("newPassword").value = "";
        document.getElementById("confirmNewPassword").value = "";

        showPasswordMessage("✓ Admin password changed successfully.");
    } catch (error) {
        console.error("Password change error:", error);
        showPasswordMessage("Could not change password. Please try again.", true);
    } finally {
        button.disabled = false;
        button.innerText = "Change Password";
    }
}

loadSettings();
</script>


</body>

</html>
