<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amber Auto Agencies - Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    margin: 0;
    color: #f59e0b;
    font-size: 28px;
}

.logo p {
    margin: 6px 0 0;
    color: #667085;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border: 1px solid #d0d5dd;
    border-radius: 7px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    background: #f59e0b;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #d97706;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#error {
    display: none;
    color: #d92d20;
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>Amber Auto Agencies</h1>
        <p>Admin Panel</p>
    </div>

    <h2>Admin Login</h2>

    <form onsubmit="login(event)">

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            autocomplete="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

        <div id="error">
            Unable to login.
        </div>

    </form>

</div>

<script>

const SUPABASE_URL = "https://vkgvexnaoqgonnmtdlkl.supabase.co";
const SUPABASE_KEY = "sb_publishable_uAdyfJX0gFlQtpbPutxjHw_acg8RzOF";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function login(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const errorBox =
        document.getElementById("error");

    const loginButton =
        document.getElementById("loginButton");

    errorBox.style.display = "none";

    loginButton.disabled = true;
    loginButton.innerText = "Logging in...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        console.error("Login error:", error);

        errorBox.innerText =
            "Incorrect email or password.";

        errorBox.style.display = "block";

        loginButton.disabled = false;
        loginButton.innerText = "Login";

        return;
    }

    if (data.user) {

        window.location.href = "dashboard.html";

    }
}

async function checkExistingLogin() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
        window.location.href = "dashboard.html";
    }
}

checkExistingLogin();

</script>

</body>
</html>
