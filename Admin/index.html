<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amber Auto Agencies - Admin Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    margin: 0;
    color: #f59e0b;
    font-size: 28px;
}

.logo p {
    margin: 6px 0 0;
    color: #667085;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border: 1px solid #d0d5dd;
    border-radius: 7px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    background: #f59e0b;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #d97706;
}

#error {
    display: none;
    color: #d92d20;
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>Amber Auto Agencies</h1>
        <p>Admin Panel</p>
    </div>

    <h2>Admin Login</h2>

    <form onsubmit="login(event)">

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

        <div id="error">
            Incorrect username or password.
        </div>

    </form>

</div>

<script>

function login(event) {

    event.preventDefault();

    var username =
        document.getElementById("username").value.trim();

    var password =
        document.getElementById("password").value;

if (username === "AmberAutoAgencies" && password === "AmBeR@71118552") {

    sessionStorage.setItem("amberAdminLoggedIn", "true");

    alert("Login successful!");

    window.location.href = "https://amberauto.in/Admin/dashboard.html";

} else {

        document.getElementById("error").style.display = "block";

    }

}

</script>

</body>
</html>
