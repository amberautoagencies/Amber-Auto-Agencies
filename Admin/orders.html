<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amber Auto Agencies - Orders</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #101828;
}

/* HEADER */

.header {
    background: #101828;
    color: white;
    padding: 18px 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.back {
    background: #f59e0b;
    color: white;
    border: none;

    padding: 9px 16px;
    border-radius: 6px;

    cursor: pointer;
    font-weight: bold;
}

/* MAIN */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

/* TITLE */

.page-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;
}

.page-title h2 {
    margin: 0;
}

/* ORDER BOX */

.orders-box {
    background: white;

    padding: 25px;

    border-radius: 10px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

/* ORDER CARD */

.order-card {
    border: 1px solid #e4e7ec;

    border-radius: 10px;

    padding: 20px;

    margin-bottom: 18px;
}

.order-card:last-child {
    margin-bottom: 0;
}

/* ORDER HEADER */

.order-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}

.order-id {
    font-weight: bold;
    color: #101828;
}

.order-date {
    font-size: 13px;
    color: #667085;
}

/* CUSTOMER */

.customer-box {
    background: #f9fafb;

    padding: 15px;

    border-radius: 8px;

    margin-bottom: 15px;
}

.customer-box h4 {
    margin: 0 0 10px;
}

.customer-box p {
    margin: 5px 0;

    color: #475467;

    font-size: 14px;
}

/* PRODUCTS */

.products-title {
    font-weight: bold;

    margin-bottom: 10px;
}

.product-item {
    border-top: 1px solid #e4e7ec;

    padding: 10px 0;

    display: flex;

    justify-content: space-between;

    gap: 15px;
}

.product-name {
    font-weight: bold;
}

.product-details {
    color: #667085;

    font-size: 13px;

    margin-top: 4px;
}

/* TOTAL */

.order-total {
    border-top: 1px solid #e4e7ec;

    margin-top: 10px;

    padding-top: 15px;

    display: flex;

    justify-content: space-between;

    font-size: 18px;

    font-weight: bold;
}

/* STATUS */

.status-box {
    margin-top: 15px;

    display: flex;

    align-items: center;

    gap: 10px;
}

.status-box label {
    font-weight: bold;
}

.status-box select {
    padding: 8px 12px;

    border: 1px solid #d0d5dd;

    border-radius: 6px;

    font-size: 14px;
}


.admin-controls {
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid #e4e7ec;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}
.control-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
    font-size: 13px;
}
.control-group select,
.control-group input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    font-size: 14px;
    background: white;
}
.order-actions {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.save-btn, .delete-btn, .notify-btn {
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    font-weight: bold;
    cursor: pointer;
}
.save-btn { background: #f59e0b; color: white; }
.delete-btn { background: #d92d20; color: white; }
.notify-btn { background: #16a34a; color: white; }
.notify-btn:hover { background: #15803d; }
.invoice-btn { background:#175cd3; color:white; }
.label-btn { background:#7f56d9; color:white; }
.invoice-btn, .label-btn { border:none; border-radius:6px; padding:9px 14px; font-weight:bold; cursor:pointer; }
.payment-line {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    background: #fffaeb;
    font-size: 14px;
    color: #475467;
}
.loading { text-align:center; padding:40px 10px; color:#667085; }
.field-hint { margin-top:5px; font-size:11px; color:#667085; }

@media (max-width: 700px) {
    .admin-controls { grid-template-columns: 1fr; }
}

 /* EMPTY */

.empty {
    text-align: center;

    padding: 50px 10px;

    color: #667085;
}

/* MOBILE */

@media (max-width: 700px) {

    .header h1 {
        font-size: 17px;
    }

    .container {
        padding: 20px 15px;
    }

    .page-title {
        align-items: flex-start;

        flex-direction: column;

        gap: 10px;
    }

    .order-header {
        flex-direction: column;

        align-items: flex-start;

        gap: 5px;
    }

    .product-item {
        flex-direction: column;

        gap: 5px;
    }

    .order-total {
        font-size: 16px;
    }

}


/* ORDER TOOLS */
.order-tools {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 12px;
    margin-bottom: 18px;
}
.order-tools input, .order-tools select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    background: white;
    font-size: 14px;
}
.status-badge, .payment-badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
}
.status-pending { background:#fffaeb; color:#b54708; }
.status-confirmed { background:#eff8ff; color:#175cd3; }
.status-processing { background:#f4f3ff; color:#5925dc; }
.status-shipped { background:#eef4ff; color:#3538cd; }
.status-delivered { background:#ecfdf3; color:#027a48; }
.status-cancelled { background:#fef3f2; color:#b42318; }
.payment-paid { background:#ecfdf3; color:#027a48; }
.payment-pending { background:#fffaeb; color:#b54708; }
.payment-failed { background:#fef3f2; color:#b42318; }
.whatsapp-btn {
    display:inline-block;
    background:#16a34a;
    color:white;
    text-decoration:none;
    padding:9px 14px;
    border-radius:6px;
    font-weight:bold;
}
.order-meta-badges { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px; }

@media (max-width:700px) {
    .order-tools { grid-template-columns:1fr; }
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <h1>
        Amber Auto Agencies — Orders
    </h1>

    <button
        class="back"
        onclick="goDashboard()">

        ← Dashboard

    </button>

</div>


<!-- MAIN -->

<div class="container">

    <div class="page-title">

        <h2>
            Order Management
        </h2>

    </div>



    <div class="order-tools">
        <input id="orderSearch" type="search"
            placeholder="Search order no., customer or mobile..."
            oninput="applyOrderFilters()">
        <select id="orderStatusFilter" onchange="applyOrderFilters()">
            <option value="">All Order Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Processing">Processing</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
        </select>
    </div>

    <div class="orders-box">

        <div id="ordersList">

            <div class="empty">

                No orders received yet.

                <br><br>

                Customer orders will appear here.

            </div>

        </div>

    </div>

</div>


<script>
const SUPABASE_URL = "https://vkgvexnaoqgonnmtdlkl.supabase.co";
const SUPABASE_KEY = "sb_publishable_uAdyfJX0gFlQtpbPutxjHw_acg8RzOF";
const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            storage: sessionStorage,
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);
let allOrders = [];

function goDashboard() {
    window.location.href = "dashboard.html";
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatDate(value) {
    if (!value) return "";
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return escapeHtml(value);
    return d.toLocaleString("en-IN");
}

function normaliseItems(items) {
    if (Array.isArray(items)) return items;
    if (typeof items === "string") {
        try {
            const parsed = JSON.parse(items);
            return Array.isArray(parsed) ? parsed : [];
        } catch (_) {
            return [];
        }
    }
    return [];
}

async function requireAdminSession() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    if (error || !session) {
        window.location.href = "index.html";
        return false;
    }
    return true;
}

async function loadOrders() {
    const ordersList = document.getElementById("ordersList");
    ordersList.innerHTML = '<div class="loading">Loading orders...</div>';

    if (!(await requireAdminSession())) return;

    const { data: orders, error } = await supabaseClient
        .from("Orders")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Orders load error:", error);
        ordersList.innerHTML = `
            <div class="empty">
                Could not load orders.<br><br>
                ${escapeHtml(error.message)}
            </div>`;
        return;
    }

    if (!orders || orders.length === 0) {
        ordersList.innerHTML = `
            <div class="empty">
                No orders received yet.<br><br>
                Customer orders will appear here.
            </div>`;
        return;
    }

    allOrders = orders;
    renderOrders(orders);
}

function renderOrders(orders) {
    const ordersList = document.getElementById("ordersList");
    ordersList.innerHTML = "";

    if (!orders || orders.length === 0) {
        ordersList.innerHTML = '<div class="empty">No matching orders found.</div>';
        return;
    }

    orders.forEach(order => {
        const items = normaliseItems(order.items);
        const card = document.createElement("div");
        card.className = "order-card";

        const productsHtml = items.length ? items.map(item => {
            const qty = Number(item.qty ?? item.quantity ?? 1);
            const price = Number(item.price || 0);
            const code = item.code ? ` (${escapeHtml(item.code)})` : "";
            return `
                <div class="product-item">
                    <div>
                        <div class="product-name">${escapeHtml(item.name || "Product")}${code}</div>
                        <div class="product-details">Qty: ${qty} × ₹${price.toLocaleString("en-IN")}</div>
                    </div>
                    <div>₹${(qty * price).toLocaleString("en-IN")}</div>
                </div>`;
        }).join("") : '<div class="product-item"><div>No product details available.</div></div>';

        const orderId = String(order.id);
        const safeDomId = orderId.replace(/[^a-zA-Z0-9_-]/g, "_");
        const orderStatus = order.order_status || "Pending";
        const paymentStatus = order.payment_status || "Pending Verification";

        card.innerHTML = `
            <div class="order-header">
                <div class="order-id">Order #${escapeHtml(order.order_number || order.id)}</div>
                <div class="order-date">${formatDate(order.created_at)}</div>
            </div>

            <div class="order-meta-badges">
                <span class="payment-badge ${paymentStatus === "Paid / Verified" || paymentStatus === "Paid" ? "payment-paid" : paymentStatus === "Failed" ? "payment-failed" : "payment-pending"}">
                    Payment: ${escapeHtml(paymentStatus)}
                </span>
                <span class="status-badge status-${escapeHtml(orderStatus.toLowerCase())}">
                    Order: ${escapeHtml(orderStatus)}
                </span>
            </div>

            <div class="customer-box">
                <h4>Customer Details</h4>
                <p><b>Name:</b> ${escapeHtml(order.customer_name || "")}</p>
                <p><b>Mobile:</b> ${escapeHtml(order.customer_phone || "")}</p>
                <p><b>Email:</b> ${escapeHtml(order.customer_email || "Not provided")}</p>
                <p><b>Address:</b> ${escapeHtml(order.customer_address || "")}</p>
                <p><b>City:</b> ${escapeHtml(order.customer_city || "")}</p>
                <p><b>State:</b> ${escapeHtml(order.customer_state || "")}</p>
                <p><b>PIN Code:</b> ${escapeHtml(order.customer_pincode || "")}</p>
                ${order.customer_notes ? `<p><b>Notes:</b> ${escapeHtml(order.customer_notes)}</p>` : ""}
            </div>

            <div class="products-title">Products</div>
            <div>${productsHtml}</div>

            <div class="order-total">
                <span>Order Total</span>
                <span>₹${Number(order.total_amount || 0).toLocaleString("en-IN")}</span>
            </div>

            <div class="payment-line">
                <b>Payment Method:</b> ${escapeHtml(order.payment_method || "UPI")}
                &nbsp; | &nbsp;
                <b>Reference:</b> ${escapeHtml(order.payment_reference || "Not provided")}
            </div>

            <div class="admin-controls">
                <div class="control-group">
                    <label>Payment Status</label>
                    <select id="payment_${safeDomId}" ${(order.payment_method === "Razorpay" && paymentStatus === "Paid / Verified") ? "disabled" : ""}>
                        ${["Pending Verification","Paid / Verified","Paid","Failed","Refunded"].map(s =>
                            `<option value="${s}" ${paymentStatus === s ? "selected" : ""}>${s}</option>`
                        ).join("")}
                    </select>
                </div>

                <div class="control-group">
                    <label>Order Status</label>
                    <select id="status_${safeDomId}">
                        ${["Pending","Confirmed","Processing","Shipped","Delivered","Cancelled"].map(s =>
                            `<option value="${s}" ${orderStatus === s ? "selected" : ""}>${s}</option>`
                        ).join("")}
                    </select>
                </div>

                <div class="control-group">
                    <label>Carrier Name</label>
                    <input id="carrier_${safeDomId}" value="${escapeHtml(order.carrier_name || "")}" placeholder="Example: Blue Dart, Delhivery, DTDC">
                </div>

                <div class="control-group">
                    <label>Estimated Delivery Date</label>
                    <input id="delivery_${safeDomId}" type="date" value="${escapeHtml(order.estimated_delivery_date || "")}">
                </div>

                <div class="control-group" style="grid-column:1/-1">
                    <label>Tracking Number</label>
                    <input id="tracking_${safeDomId}" value="${escapeHtml(order.tracking_number || "")}" placeholder="Enter tracking number">
                </div>

                <div class="control-group" style="grid-column:1/-1">
                    <label>Direct Tracking Link</label>
                    <input id="trackinglink_${safeDomId}" type="url" value="${escapeHtml(order.tracking_link || "")}" placeholder="Example: https://www.bluedart.com/tracking?...">
                    <div class="field-hint">Paste the carrier's official tracking URL for this shipment.</div>
                </div>
            </div>

            <div class="order-actions">
                <button class="notify-btn" onclick='notifyCustomer(${JSON.stringify(orderId)}, ${JSON.stringify(safeDomId)})'>
                    WhatsApp Customer
                </button>
                <button class="save-btn" onclick='saveOrder(${JSON.stringify(orderId)}, ${JSON.stringify(safeDomId)})'>
                    Save Changes
                </button>
                <button class="invoice-btn" onclick='printInvoice(${JSON.stringify(orderId)})'>View / Print Invoice</button>
                <button class="label-btn" onclick='printShippingLabel(${JSON.stringify(orderId)})'>Print Shipping Label</button>
                <button class="delete-btn" onclick='deleteOrder(${JSON.stringify(orderId)})'>
                    Delete Order
                </button>
            </div>
        `;

        ordersList.appendChild(card);
    });
}


function applyOrderFilters() {
    const query = (document.getElementById("orderSearch")?.value || "").trim().toLowerCase();
    const status = document.getElementById("orderStatusFilter")?.value || "";

    const filtered = allOrders.filter(order => {
        const haystack = [
            order.order_number,
            order.id,
            order.customer_name,
            order.customer_phone
        ].map(v => String(v || "").toLowerCase()).join(" ");

        const matchesSearch = !query || haystack.includes(query);
        const matchesStatus = !status || (order.order_status || "Pending") === status;
        return matchesSearch && matchesStatus;
    });

    renderOrders(filtered);
}


function formatDeliveryDate(value) {
    if (!value) return "";
    const d = new Date(value + "T00:00:00");
    if (Number.isNaN(d.getTime())) return value;
    return d.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric"
    });
}

function buildCustomerStatusMessage(order, status, trackingNumber, carrierName, deliveryDate, trackingLink, invoiceLink = '') {
    const orderNo = order.order_number || order.id;
    const name = order.customer_name || "Customer";

    if (status === "Shipped") {
        let message = `Hi ${name}! Great news — your Amber Auto Agencies order (${orderNo}) is on its way!`;

        if (carrierName) {
            message += `

Carrier: ${carrierName}`;
        }

        if (trackingNumber) {
            message += `
Tracking Number: ${trackingNumber}`;
        }

        if (deliveryDate) {
            message += `
Expected Delivery: ${formatDeliveryDate(deliveryDate)}`;
        }

        if (trackingLink) {
            message += `
Track Here: ${trackingLink}`;
        }

        message += `

Thanks for shopping with us!
Amber Auto Agencies`;
        return message;
    }

    let message =
`Hi ${name}!

Your Amber Auto Agencies order (${orderNo}) has been updated.

Order Status: ${status}`;

    if (status === "Confirmed") {
        message += `

Your order has been confirmed and will be processed shortly.`;
    } else if (status === "Processing") {
        message += `

Your order is currently being prepared for dispatch.`;
    } else if (status === "Delivered") {
        message = `Hi ${name}! Great news — your Amber Auto Agencies order (${orderNo}) has been delivered successfully.`;

        if (carrierName) {
            message += `

Carrier: ${carrierName}`;
        }

        if (trackingNumber) {
            message += `
Tracking Number: ${trackingNumber}`;
        }

        if (trackingLink) {
            message += `
Track Here: ${trackingLink}`;
        }

        if (invoiceLink) {
            message += `

Invoice:
${invoiceLink}`;
        }

        message += `

Thanks for shopping with us!
Amber Auto Agencies`;
    } else if (status === "Cancelled") {
        message += `

Your order has been cancelled. Please contact Amber Auto Agencies if you need any assistance.`;
    } else {
        message += `

We have received your order and it is currently pending confirmation.`;
    }

    message += `

Amber Auto Agencies`;
    return message;
}

function notifyCustomer(id, safeDomId) {
    const order = allOrders.find(order => String(order.id) === String(id));

    if (!order) {
        alert("Could not find this order.");
        return;
    }

    const statusElement = document.getElementById("status_" + safeDomId);
    const trackingElement = document.getElementById("tracking_" + safeDomId);
    const carrierElement = document.getElementById("carrier_" + safeDomId);
    const deliveryElement = document.getElementById("delivery_" + safeDomId);
    const trackingLinkElement = document.getElementById("trackinglink_" + safeDomId);

    const status = statusElement ? statusElement.value : (order.order_status || "Pending");
    const trackingNumber = trackingElement ? trackingElement.value.trim() : (order.tracking_number || "");
    const carrierName = carrierElement ? carrierElement.value.trim() : (order.carrier_name || "");
    const deliveryDate = deliveryElement ? deliveryElement.value : (order.estimated_delivery_date || "");
    const trackingLink = trackingLinkElement ? trackingLinkElement.value.trim() : (order.tracking_link || "");

    if (status === "Shipped" && !trackingNumber) {
        alert("Please enter a tracking number before sending the Shipped message.");
        if (trackingElement) trackingElement.focus();
        return;
    }

    let phone = String(order.customer_phone || "").replace(/\D/g, "");
    phone = phone.replace(/^91/, "");

    if (!/^[6-9]\d{9}$/.test(phone)) {
        alert("Customer mobile number is not valid for WhatsApp.");
        return;
    }

    let invoiceLink = "";
    if (status === "Delivered") {
        if (!order.invoice_token) {
            alert("Please click Save Changes after selecting Delivered. This creates the secure invoice link.");
            return;
        }
        invoiceLink = `https://amberauto.in/?invoice=${encodeURIComponent(order.invoice_token)}`;
    }

    const message = buildCustomerStatusMessage(order, status, trackingNumber, carrierName, deliveryDate, trackingLink, invoiceLink);
    const whatsappUrl = `https://wa.me/91${phone}?text=${encodeURIComponent(message)}`;

    window.open(whatsappUrl, "_blank", "noopener,noreferrer");
}

async function saveOrder(id, safeDomId) {
    if (!(await requireAdminSession())) return;

    const paymentSelect = document.getElementById("payment_" + safeDomId);
    const order_status = document.getElementById("status_" + safeDomId).value;
    const tracking_number = document.getElementById("tracking_" + safeDomId).value.trim();
    const carrier_name = document.getElementById("carrier_" + safeDomId).value.trim();
    const estimated_delivery_date = document.getElementById("delivery_" + safeDomId).value || null;
    const tracking_link = document.getElementById("trackinglink_" + safeDomId).value.trim();

    if (order_status === "Shipped" && !tracking_number) {
        alert("Please enter a tracking number before marking this order as Shipped.");
        document.getElementById("tracking_" + safeDomId).focus();
        return;
    }

    if (order_status === "Shipped" && !carrier_name) {
        alert("Please enter the carrier name before marking this order as Shipped.");
        document.getElementById("carrier_" + safeDomId).focus();
        return;
    }

    if (tracking_link && !/^https?:\/\//i.test(tracking_link)) {
        alert("Tracking link must start with http:// or https://");
        document.getElementById("trackinglink_" + safeDomId).focus();
        return;
    }

    const currentOrder = allOrders.find(order => String(order.id) === String(id));
    const payment_status = paymentSelect.disabled
        ? (currentOrder?.payment_status || "Paid / Verified")
        : paymentSelect.value;

    let invoice_token = currentOrder?.invoice_token || null;
    if (order_status === "Delivered" && !invoice_token) {
        invoice_token = (crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
    }

    const { error } = await supabaseClient
        .from("Orders")
        .update({
            payment_status,
            order_status,
            tracking_number: tracking_number || null,
            carrier_name: carrier_name || null,
            estimated_delivery_date,
            tracking_link: tracking_link || null,
            invoice_token
        })
        .eq("id", id);

    if (error) {
        console.error("Order update error:", error);
        alert("Could not update order: " + error.message);
        return;
    }

    alert(order_status === "Delivered"
        ? "Order marked Delivered. Secure invoice link created. You can now use WhatsApp Customer."
        : "Order updated successfully. You can now use WhatsApp Customer to send the latest status.");
    await loadOrders();
}


function printInvoice(id){
  const o=allOrders.find(x=>String(x.id)===String(id)); if(!o){alert("Order not found.");return;}
  const items=normaliseItems(o.items);

  <div class="top"><div><h1>Amber Auto Agencies</h1><div class="muted">Invoice</div><div class="muted">Near Bhokarden Naka Aurangabad Road, Jalna, Maharashtra - 431203</div><div class="muted">GSTIN: 27BJQPA4873B1Z8</div><div class="muted">Email: amberautoagencies@gmail.com</div></div><div style="text-align:right"><b>Order:</b> ${escapeHtml(o.order_number||o.id)}<br><span class="muted">${formatDate(o.created_at)}</span></div></div>
  <div class="box"><b>Bill / Ship To</b><br>${escapeHtml(o.customer_name||"")}<br>${escapeHtml(o.customer_phone||"")}<br>${o.customer_email?escapeHtml(o.customer_email)+"<br>":""}${escapeHtml(addr)}</div>
  <table><thead><tr><th>Product</th><th>Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Amount</th></tr></thead><tbody>${rows||'<tr><td colspan="4">No product details available.</td></tr>'}</tbody><tfoot><tr><td colspan="3" style="text-align:right" class="total">Order Total</td><td style="text-align:right" class="total">₹${Number(o.total_amount||0).toLocaleString("en-IN")}</td></tr></tfoot></table>

async function deleteOrder(id) {
    if (!(await requireAdminSession())) return;
    if (!confirm("Delete this order permanently?")) return;

    const { error } = await supabaseClient
        .from("Orders")
        .delete()
        .eq("id", id);

    if (error) {
        console.error("Order delete error:", error);
        alert("Could not delete order: " + error.message);
        return;
    }

    alert("Order deleted successfully.");
    await loadOrders();
}
