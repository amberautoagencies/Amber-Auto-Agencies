<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amber Auto Agencies - Orders</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #101828;
}

/* HEADER */

.header {
    background: #101828;
    color: white;
    padding: 18px 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.back {
    background: #f59e0b;
    color: white;
    border: none;

    padding: 9px 16px;
    border-radius: 6px;

    cursor: pointer;
    font-weight: bold;
}

/* MAIN */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

/* TITLE */

.page-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;
}

.page-title h2 {
    margin: 0;
}

/* ORDER BOX */

.orders-box {
    background: white;

    padding: 25px;

    border-radius: 10px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

/* ORDER CARD */

.order-card {
    border: 1px solid #e4e7ec;

    border-radius: 10px;

    padding: 20px;

    margin-bottom: 18px;
}

.order-card:last-child {
    margin-bottom: 0;
}

/* ORDER HEADER */

.order-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}

.order-id {
    font-weight: bold;
    color: #101828;
}

.order-date {
    font-size: 13px;
    color: #667085;
}

/* CUSTOMER */

.customer-box {
    background: #f9fafb;

    padding: 15px;

    border-radius: 8px;

    margin-bottom: 15px;
}

.customer-box h4 {
    margin: 0 0 10px;
}

.customer-box p {
    margin: 5px 0;

    color: #475467;

    font-size: 14px;
}

/* PRODUCTS */

.products-title {
    font-weight: bold;

    margin-bottom: 10px;
}

.product-item {
    border-top: 1px solid #e4e7ec;

    padding: 10px 0;

    display: flex;

    justify-content: space-between;

    gap: 15px;
}

.product-name {
    font-weight: bold;
}

.product-details {
    color: #667085;

    font-size: 13px;

    margin-top: 4px;
}

/* TOTAL */

.order-total {
    border-top: 1px solid #e4e7ec;

    margin-top: 10px;

    padding-top: 15px;

    display: flex;

    justify-content: space-between;

    font-size: 18px;

    font-weight: bold;
}

/* STATUS */

.status-box {
    margin-top: 15px;

    display: flex;

    align-items: center;

    gap: 10px;
}

.status-box label {
    font-weight: bold;
}

.status-box select {
    padding: 8px 12px;

    border: 1px solid #d0d5dd;

    border-radius: 6px;

    font-size: 14px;
}


.admin-controls {
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid #e4e7ec;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}
.control-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
    font-size: 13px;
}
.control-group select,
.control-group input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    font-size: 14px;
    background: white;
}
.order-actions {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.save-btn, .delete-btn {
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    font-weight: bold;
    cursor: pointer;
}
.save-btn { background: #f59e0b; color: white; }
.delete-btn { background: #d92d20; color: white; }
.payment-line {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    background: #fffaeb;
    font-size: 14px;
    color: #475467;
}
.loading { text-align:center; padding:40px 10px; color:#667085; }

@media (max-width: 700px) {
    .admin-controls { grid-template-columns: 1fr; }
}

 /* EMPTY */

.empty {
    text-align: center;

    padding: 50px 10px;

    color: #667085;
}

/* MOBILE */

@media (max-width: 700px) {

    .header h1 {
        font-size: 17px;
    }

    .container {
        padding: 20px 15px;
    }

    .page-title {
        align-items: flex-start;

        flex-direction: column;

        gap: 10px;
    }

    .order-header {
        flex-direction: column;

        align-items: flex-start;

        gap: 5px;
    }

    .product-item {
        flex-direction: column;

        gap: 5px;
    }

    .order-total {
        font-size: 16px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <h1>
        Amber Auto Agencies — Orders
    </h1>

    <button
        class="back"
        onclick="goDashboard()">

        ← Dashboard

    </button>

</div>


<!-- MAIN -->

<div class="container">

    <div class="page-title">

        <h2>
            Order Management
        </h2>

    </div>


    <div class="orders-box">

        <div id="ordersList">

            <div class="empty">

                No orders received yet.

                <br><br>

                Customer orders will appear here.

            </div>

        </div>

    </div>

</div>


<script>
const SUPABASE_URL = "https://vkgvexnaoqgonnmtdlkl.supabase.co";
const SUPABASE_KEY = "sb_publishable_uAdyfJX0gFlQtpbPutxjHw_acg8RzOF";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function goDashboard() {
    window.location.href = "dashboard.html";
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatDate(value) {
    if (!value) return "";
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return escapeHtml(value);
    return d.toLocaleString("en-IN");
}

function normaliseItems(items) {
    if (Array.isArray(items)) return items;
    if (typeof items === "string") {
        try {
            const parsed = JSON.parse(items);
            return Array.isArray(parsed) ? parsed : [];
        } catch (_) {
            return [];
        }
    }
    return [];
}

async function requireAdminSession() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    if (error || !session) {
        window.location.href = "index.html";
        return false;
    }
    return true;
}

async function loadOrders() {
    const ordersList = document.getElementById("ordersList");
    ordersList.innerHTML = '<div class="loading">Loading orders...</div>';

    if (!(await requireAdminSession())) return;

    const { data: orders, error } = await supabaseClient
        .from("Orders")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Orders load error:", error);
        ordersList.innerHTML = `
            <div class="empty">
                Could not load orders.<br><br>
                ${escapeHtml(error.message)}
            </div>`;
        return;
    }

    if (!orders || orders.length === 0) {
        ordersList.innerHTML = `
            <div class="empty">
                No orders received yet.<br><br>
                Customer orders will appear here.
            </div>`;
        return;
    }

    ordersList.innerHTML = "";

    orders.forEach(order => {
        const items = normaliseItems(order.items);
        const card = document.createElement("div");
        card.className = "order-card";

        const productsHtml = items.length ? items.map(item => {
            const qty = Number(item.qty ?? item.quantity ?? 1);
            const price = Number(item.price || 0);
            const code = item.code ? ` (${escapeHtml(item.code)})` : "";
            return `
                <div class="product-item">
                    <div>
                        <div class="product-name">${escapeHtml(item.name || "Product")}${code}</div>
                        <div class="product-details">Qty: ${qty} × ₹${price.toLocaleString("en-IN")}</div>
                    </div>
                    <div>₹${(qty * price).toLocaleString("en-IN")}</div>
                </div>`;
        }).join("") : '<div class="product-item"><div>No product details available.</div></div>';

        const orderId = String(order.id);
        const safeDomId = orderId.replace(/[^a-zA-Z0-9_-]/g, "_");
        const orderStatus = order.order_status || "Pending";
        const paymentStatus = order.payment_status || "Pending Verification";

        card.innerHTML = `
            <div class="order-header">
                <div class="order-id">Order #${escapeHtml(order.order_number || order.id)}</div>
                <div class="order-date">${formatDate(order.created_at)}</div>
            </div>

            <div class="customer-box">
                <h4>Customer Details</h4>
                <p><b>Name:</b> ${escapeHtml(order.customer_name || "")}</p>
                <p><b>Mobile:</b> ${escapeHtml(order.customer_phone || "")}</p>
                <p><b>Email:</b> ${escapeHtml(order.customer_email || "Not provided")}</p>
                <p><b>Address:</b> ${escapeHtml(order.customer_address || "")}</p>
                <p><b>City:</b> ${escapeHtml(order.customer_city || "")}</p>
                <p><b>State:</b> ${escapeHtml(order.customer_state || "")}</p>
                <p><b>PIN Code:</b> ${escapeHtml(order.customer_pincode || "")}</p>
                ${order.customer_notes ? `<p><b>Notes:</b> ${escapeHtml(order.customer_notes)}</p>` : ""}
            </div>

            <div class="products-title">Products</div>
            <div>${productsHtml}</div>

            <div class="order-total">
                <span>Order Total</span>
                <span>₹${Number(order.total_amount || 0).toLocaleString("en-IN")}</span>
            </div>

            <div class="payment-line">
                <b>Payment Method:</b> ${escapeHtml(order.payment_method || "UPI")}
                &nbsp; | &nbsp;
                <b>Reference:</b> ${escapeHtml(order.payment_reference || "Not provided")}
            </div>

            <div class="admin-controls">
                <div class="control-group">
                    <label>Payment Status</label>
                    <select id="payment_${safeDomId}">
                        ${["Pending Verification","Paid","Failed","Refunded"].map(s =>
                            `<option value="${s}" ${paymentStatus === s ? "selected" : ""}>${s}</option>`
                        ).join("")}
                    </select>
                </div>

                <div class="control-group">
                    <label>Order Status</label>
                    <select id="status_${safeDomId}">
                        ${["Pending","Confirmed","Processing","Shipped","Delivered","Cancelled"].map(s =>
                            `<option value="${s}" ${orderStatus === s ? "selected" : ""}>${s}</option>`
                        ).join("")}
                    </select>
                </div>

                <div class="control-group" style="grid-column:1/-1">
                    <label>Tracking Number</label>
                    <input id="tracking_${safeDomId}" value="${escapeHtml(order.tracking_number || "")}" placeholder="Enter tracking number">
                </div>
            </div>

            <div class="order-actions">
                <button class="save-btn" onclick='saveOrder(${JSON.stringify(orderId)}, ${JSON.stringify(safeDomId)})'>
                    Save Changes
                </button>
                <button class="delete-btn" onclick='deleteOrder(${JSON.stringify(orderId)})'>
                    Delete Order
                </button>
            </div>
        `;

        ordersList.appendChild(card);
    });
}

async function saveOrder(id, safeDomId) {
    if (!(await requireAdminSession())) return;

    const payment_status = document.getElementById("payment_" + safeDomId).value;
    const order_status = document.getElementById("status_" + safeDomId).value;
    const tracking_number = document.getElementById("tracking_" + safeDomId).value.trim();

    const { error } = await supabaseClient
        .from("Orders")
        .update({
            payment_status,
            order_status,
            tracking_number: tracking_number || null
        })
        .eq("id", id);

    if (error) {
        console.error("Order update error:", error);
        alert("Could not update order: " + error.message);
        return;
    }

    alert("Order updated successfully.");
    await loadOrders();
}

async function deleteOrder(id) {
    if (!(await requireAdminSession())) return;
    if (!confirm("Delete this order permanently?")) return;

    const { error } = await supabaseClient
        .from("Orders")
        .delete()
        .eq("id", id);

    if (error) {
        console.error("Order delete error:", error);
        alert("Could not delete order: " + error.message);
        return;
    }

    alert("Order deleted successfully.");
    await loadOrders();
}

loadOrders();
</script>

</body>

</html>
